name: Check Jeebli Frontend

on:
  push:
    branches: [main]
    paths:
      - '*.js'
      - '*.html'
      - '*.css'
      - 'assets/**'
      - '.github/workflows/driver-check.yml'
  pull_request:
    paths:
      - '*.js'
      - '*.html'
      - '*.css'
      - 'assets/**'

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check driver.js
          node --check admin.js
          node --check config.js
          node --check tracking.js
          node --check driver-ui-patch.js
          node --check admin-driver-patch.js
          node --check admin-areas.js
          node --check customer-areas.js
          node --check brand.js