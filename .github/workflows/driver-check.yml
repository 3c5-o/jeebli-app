name: Check Jeebli Frontend

on:
  push:
    branches: [main]
    paths:
      - '*.js'
      - '*.html'
      - '*.css'
      - '*.webmanifest'
      - 'assets/**'
      - '.github/workflows/driver-check.yml'
  pull_request:
    paths:
      - '*.js'
      - '*.html'
      - '*.css'
      - '*.webmanifest'
      - 'assets/**'

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript and manifest syntax
        run: |
          node --check app.js
          node --check driver.js
          node --check admin.js
          node --check config.js
          node --check tracking.js
          node --check driver-ui-patch.js
          node --check admin-driver-patch.js
          node --check admin-areas.js
          node --check customer-areas.js
          node --check customer-v2.js
          node --check customer-v3.js
          node --check customer-v3-bridge.js
          node --check customer-services.js
          node --check customer-starex.js
          node --check customer-launch.js
          node --check customer-avatar.js
          node --check customer-addresses.js
          node --check customer-system-notify.js
          node --check customer-polish.js
          node --check customer-ux.js
          node --check customer-push.js
          node --check customer-lux.js
          node --check sw.js
          node --check brand.js
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('manifest ok')"
